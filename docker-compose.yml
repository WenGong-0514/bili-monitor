services:
  bili-monitor:
    build: .
    image: bili-monitor:latest
    container_name: bili-monitor
    restart: unless-stopped
    runtime: nvidia
    cpus: 24
    mem_limit: 12g
    cpu_shares: 1024
    environment:
      - TZ=Asia/Shanghai
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # 运行期持久化数据(状态/总结缓存/广告结果/工作目录)
      - ./data:/app/data
      # GPU 会话管理模块(懒加载/任务后清缓存/空闲自动释放显存)
      - ./gpu_release.py:/app/gpu_release.py:ro
      # 本地 ASR 模型缓存(modelscope), 避免每次重建后重新下载
      - modelscope_cache:/root/.cache/modelscope
      # 真实配置与黑名单以只读方式挂载, 不打包进镜像
      - ./config.json:/app/config.json:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./blacklist.txt:/app/blacklist.txt:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  modelscope_cache:
