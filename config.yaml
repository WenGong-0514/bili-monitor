monitor_config: config.json
qq_notify: true
download:
  format: bestvideo*+bestaudio/best
visual:
  models:
    - glm-4.6v-flash
    - glm-4v-flash
  max_frames: 72
  window_frames: 5
  step_frames: 3
asr:
  model: iic/SenseVoiceSmall
  chunk_seconds: 30
  threads: 6
  device: auto
  gpu_idle_release_sec: 1800   # 空闲30分钟后卸载模型并把显存还给驱动(<=0=只在任务后清缓存)
text:
  model: glm-5.2
detection:
  min_duration: 10
  merge_gap: 15
  single_confidence: 0.78

local_pipeline:
  enabled: false
